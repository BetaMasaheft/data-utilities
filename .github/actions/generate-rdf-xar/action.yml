name: Create an achive for BM files in RDF
description: Github Action to create a XAR package containing the BetaMasaheft files in RDF format
author: 'Claudius Teodorescu <claudius.teodorescu@gmail.com>'

inputs:
  who-to-greet:  # id of input
    description: 'Who to greet'
    required: true
    default: 'World'
outputs:
  time: # id of output
    description: 'The time we greeted you'
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.who-to-greet }}