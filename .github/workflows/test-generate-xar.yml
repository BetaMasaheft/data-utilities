name: Test for xar package generation

on: [workflow_dispatch]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-package:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    container:
          image: ghcr.io/betamasaheft/data-utilities
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write           
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Generate the xar package
        run: ./modules/generate-xar-package/generate-xar-package.sh
      - name: Create the release
        uses: iamkubi/github-release@2.0
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          tag: "0.1"
          files: bm-fonts.xar
          gzip: false
          allow_override: true
