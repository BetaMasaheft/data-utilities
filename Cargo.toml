[package]
name = "data-utilities"
version = "0.0.1"
edition = "2024"
authors = ["Claudius Teodorescu <claudius.teodorescu@gmail.com>"]
description = "Utility programs for processing the documents of the Betamasaheft project."

[dependencies]
clap = "4.6.9"
decompress = "0.6.0"
glob = "0.3.4"
oxrdfxml = "0.2.5"
oxttl = "0.2.5"
conceptual-mapper-lib = { git = "https://gitlab.com/claudius-teodorescu/conceptual-mapper", package = "conceptual-mapper-lib", version = "0.1.17" }

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"
